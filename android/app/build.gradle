plugins { id 'com.android.application' }
def keyConfigFile = rootProject.file('../.signing/android.json')
def keyConfig = keyConfigFile.exists() ? new groovy.json.JsonSlurper().parse(keyConfigFile) : null
android {
    namespace 'app.dayflow'
    compileSdk 36
    packaging { jniLibs { excludes += ["**/libdayflow_asr.so"] } }
    defaultConfig {
        applicationId 'app.dayflow'
        minSdk 26
        targetSdk 36
        versionCode 132
        versionName '1.3.2'
        testInstrumentationRunner 'app.dayflow.SmokeTest'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
    signingConfigs {
        release {
            if (keyConfig != null) {
                storeFile file(keyConfig.storeFile)
                storePassword keyConfig.storePassword
                keyAlias keyConfig.keyAlias
                keyPassword keyConfig.keyPassword
            } else if (System.getenv('DAYFLOW_KEYSTORE')) {
                storeFile file(System.getenv('DAYFLOW_KEYSTORE'))
                storePassword System.getenv('DAYFLOW_STORE_PASSWORD')
                keyAlias 'dayflow'
                keyPassword System.getenv('DAYFLOW_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/thirdPartyAssets').get().asFile)
}
tasks.register('generateThirdPartyNotices', Copy) {
    from rootProject.file('../THIRD_PARTY_NOTICES.md')
    into layout.buildDirectory.dir('generated/thirdPartyAssets/licenses')
}
tasks.named('preBuild').configure { dependsOn 'generateThirdPartyNotices' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation project(':assistantPlugin')
    implementation project(':voicePlugin')
    implementation project(':markdownPlugin')
    implementation project(':almanacPlugin')
    implementation 'androidx.javascriptengine:javascriptengine:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'com.google.re2j:re2j:1.8'
    implementation 'cn.6tail:lunar:1.7.7'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'net.sf.biweekly:biweekly:0.6.8'
    implementation 'com.vanniktech:android-image-cropper:4.7.0'
}

// Export only local resolved inputs for the signed module packaging tool.
tasks.register('exportModuleClasspath') {
    dependsOn ':assistantPlugin:bundleReleaseAar', ':markdownPlugin:bundleReleaseAar', ':almanacPlugin:bundleReleaseAar', ':voicePlugin:bundleReleaseAar'
    doLast {
        def output = layout.buildDirectory.file('module-classpath.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = configurations.releaseRuntimeClasspath.incoming.artifactView { attributes { attribute(org.gradle.api.attributes.Attribute.of("artifactType", String), "android-classes-jar") } }.files.files.collect { it.absolutePath }.join('\n')
    }
}
