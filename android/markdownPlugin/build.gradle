plugins { id 'com.android.library' }
android {
 namespace 'app.dayflow.markdown'
 compileSdk 36
 defaultConfig { minSdk 26; targetSdk 36 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/thirdPartyAssets').get().asFile)
}
dependencies {
 implementation 'androidx.recyclerview:recyclerview:1.4.0'
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'com.google.android.material:material:1.14.0'
 implementation 'io.noties.markwon:core:4.6.2'
 implementation 'io.noties.markwon:ext-tables:4.6.2'
 implementation 'io.noties.markwon:ext-latex:4.6.2'
 implementation 'io.noties.markwon:inline-parser:4.6.2'
 implementation 'io.noties.markwon:image:4.6.2'
 implementation 'io.noties.markwon:html:4.6.2'
 implementation 'io.noties.markwon:linkify:4.6.2'
 implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
 implementation 'io.noties.markwon:ext-tasklist:4.6.2'
 implementation 'io.github.yahiaangelo.markdownedittext:markdownedittext:1.1.3'
}

tasks.register('generateThirdPartyNotices', Copy) { from rootProject.file('../THIRD_PARTY_NOTICES.md'); into layout.buildDirectory.dir('generated/thirdPartyAssets/licenses') }
tasks.named('preBuild').configure { dependsOn 'generateThirdPartyNotices' }
