plugins { id 'com.android.application' }
def keyFile = rootProject.file('../.signing/android.json')
def keyConfig = keyFile.exists() ? new groovy.json.JsonSlurper().parse(keyFile) : null
android {
 namespace 'app.dayflow.ocr'
 compileSdk 36
 defaultConfig { applicationId 'app.dayflow.ocr'; minSdk 26; targetSdk 36; versionCode 130; versionName '1.3.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { if (keyConfig != null) { storeFile file(keyConfig.storeFile); storePassword keyConfig.storePassword; keyAlias keyConfig.keyAlias; keyPassword keyConfig.keyPassword } } }
 buildTypes { release { signingConfig signingConfigs.release } }
 splits { abi { enable true; reset(); include 'arm64-v8a','armeabi-v7a'; universalApk false } }
}
dependencies {
 implementation files('libs/OcrLibrary-1.3.0-release.aar')
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'androidx.recyclerview:recyclerview:1.4.0'
 implementation 'com.google.android.material:material:1.14.0'
}
tasks.named('preBuild').configure { doFirst { if (!file('libs/OcrLibrary-1.3.0-release.aar').exists()) throw new GradleException('Run python tools/fetch_ocr.py first (official RapidOCR AAR).') } }
