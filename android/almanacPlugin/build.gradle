plugins { id 'com.android.application' }
def keyFile = rootProject.file('../.signing/android.json')
def keyConfig = keyFile.exists() ? new groovy.json.JsonSlurper().parse(keyFile) : null
android {
 namespace 'app.dayflow.almanac'
 compileSdk 36
 defaultConfig { applicationId 'app.dayflow.almanac'; minSdk 26; targetSdk 36; versionCode 130; versionName '1.3.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { if (keyConfig != null) { storeFile file(keyConfig.storeFile); storePassword keyConfig.storePassword; keyAlias keyConfig.keyAlias; keyPassword keyConfig.keyPassword } } }
 buildTypes { release { signingConfig signingConfigs.release } }
 sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/thirdPartyAssets').get().asFile)
}
dependencies {
 implementation 'androidx.recyclerview:recyclerview:1.4.0'
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'com.google.android.material:material:1.14.0'
 implementation 'cn.6tail:lunar:1.7.7'
}

tasks.register('generateThirdPartyNotices', Copy) { from rootProject.file('../THIRD_PARTY_NOTICES.md'); into layout.buildDirectory.dir('generated/thirdPartyAssets/licenses') }
tasks.named('preBuild').configure { dependsOn 'generateThirdPartyNotices' }
