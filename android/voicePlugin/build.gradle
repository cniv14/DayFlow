plugins { id 'com.android.library' }
android {
 namespace 'app.dayflow.voice'
 compileSdk 36
 ndkVersion '28.0.13004108'
 defaultConfig { minSdk 26; targetSdk 36; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }; externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' } }
}
dependencies { implementation 'androidx.recyclerview:recyclerview:1.4.0'; implementation 'androidx.appcompat:appcompat:1.7.1'; implementation 'com.google.android.material:material:1.14.0' }
